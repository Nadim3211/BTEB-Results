<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTEB Diploma Result</title><style>body{background:linear-gradient(135deg,#11998e,#38ef7d);padding:20px;font-family:sans-serif}.box{background:white;padding:25px;border-radius:15px;max-width:500px;margin:30px auto}h1{text-align:center;color:#11998e}input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:2px solid #ddd}button{background:#11998e;color:white;border:none;font-weight:bold}</style></head><body><div class="box"><h1>ডিপ্লোমা রেজাল্ট</h1><select id="exam"><option value="diploma">Diploma in Engineering</option></select><select id="year"><option>2025</option><option>2024</option></select><select id="semester"><option value="1">1st Semester</option><option value="8">8th Semester</option></select><input id="roll" placeholder="রোল নম্বর"><input id="reg" placeholder="রেজিস্ট্রেশন নম্বর"><button onclick="check()">রেজাল্ট দেখুন</button><div id="result"></div></div><script>async function check(){const e=exam.value,y=year.value,s=semester.value,r=roll.value,g=reg.value;const res=await fetch(`/api/diploma?exam=${e}&year=${y}&sem=${s}&roll=${r}&reg=${g}`);const data=await res.json();data.success?result.innerHTML=data.html:result.innerHTML=`<p style="color:red">${data.error}</p>`}</script></body></html>
