<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diploma Results Zone</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { 
        background: linear-gradient(-45deg, #667eea, #764ba2, #6B8CE3, #8E44AD);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 20px; 
    }
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container { 
        width: 100%; 
        max-width: 420px; 
        background: rgba(255, 255, 255, 0.95); 
        backdrop-filter: blur(10px);
        padding: 35px 30px; 
        border-radius: 25px; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        text-align: center; 
        border: 1px solid rgba(255,255,255,0.3);
        animation: slideUp 0.6s ease;
    }
    @keyframes slideUp { from {opacity:0; transform: translateY(30px);} to {opacity:1; transform: translateY(0);} }

    /* লোগো 100% মাঝে */
    .logo-container { 
        margin-bottom: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
    }
    .logo-container img { 
        width: 100px; 
        height: 100px; 
        border-radius: 50%; 
        border: 4px solid #667eea;
        object-fit: cover; /* ছবি ক্রপ হয়ে মাঝে বসবে */
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        transition: transform 0.3s;
    }
    .logo-container img:hover {
        transform: scale(1.1) rotate(5deg);
    }

    h1 { font-size: 26px; color: #333; margin-bottom: 5px; font-weight: 800; }
    h3 { font-size: 14px; color: #667eea; margin-bottom: 25px; font-weight: 700; letter-spacing: 1.5px; }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #444; font-size: 14px; }
    .input-group input, .input-group select { 
        width: 100%; 
        padding: 14px 15px; 
        border: 2px solid #e0e0e0; 
        border-radius: 12px; 
        font-size: 15px;
        background: #f8f9fa;
        transition: 0.3s;
    }
    .input-group input:focus, .input-group select:focus {
        border-color: #667eea;
        outline: none;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    }

    .btn { 
        width: 100%; 
        padding: 15px; 
        border: none; 
        border-radius: 12px; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        color: #fff; 
        font-size: 17px;
        font-weight: 800;
        cursor: pointer; 
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    .btn:hover { 
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }
    .btn:active {
        transform: translateY(0);
    }

    .developer-name { margin-top: 25px; color: #777; font-size: 13px; }
    .facebook-link { margin-top: 12px; }
    .facebook-link a { color: #667eea; text-decoration: none; font-weight: 700; transition: 0.3s; }
    .facebook-link a:hover { text-decoration: underline; color: #764ba2; }
</style>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Bangladesh_Technical_Education_Board_logo.png" alt="BTEB Logo">
    </div>
    <h1>Diploma Results Zone</h1>
    <h3>DIPLOMA IN ENGINEERING</h3>

    <form method="post" action="result.php">
        <div class="input-group">
            <label for="regulation">Select Regulation</label>
            <select id="regulation" name="regulation" required>
                <option value="" disabled selected>Select Regulation</option>
                <option value="2010">2010</option>
                <option value="2016">2016</option>
                <option value="2022">2022</option>
            </select>
        </div>

        <div class="input-group">
            <label for="rollNumber">Enter Your Roll Number</label>
            <input type="text" id="rollNumber" name="rollNumber" placeholder="যেমন: 571669" required>
        </div>

        <button type="submit" class="btn">Check Result</button>
    </form>

    <div class="developer-name">
        <p>Developed by Atikur Rahman Nadim</p>
    </div>
    <div class="facebook-link">
        <a href="https://www.facebook.com/ansatikur">Developer's Facebook Profile</a>
    </div>
</div>
</body>
</html>
