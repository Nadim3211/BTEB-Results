<!DOCTYPE html>
<html lang="bn">
<head>
    <title>BTEB Result</title>
    <style>
        body{text-align:center; padding:50px; font-family:Arial}
        input,button{padding:10px; margin:5px; width:200px}
        button{background:blue; color:white; border:none; cursor:pointer}
        #result{margin-top:20px; font-size:20px}
    </style>
</head>
<body>
    <h2>BTEB Result Checker</h2>
    <input id="roll" placeholder="Roll লিখো"><br>
    <input id="reg" placeholder="Reg লিখো"><br>
    <button onclick="getResult()">Result দেখো</button>
    <div id="result"></div>

<script>
async function getResult(){
    const roll = document.getElementById('roll').value;
    const reg = document.getElementById('reg').value;
    document.getElementById('result').innerText = "খোঁজা হচ্ছে...";
    
    const res = await fetch(`/api/result?roll=${roll}&reg=${reg}`);
    const data = await res.json();
    
    if(data.gpa){
        document.getElementById('result').innerHTML = 
        `Roll: ${roll} <br> GPA: <b>${data.gpa}</b> <br> CGPA: <b>${data.cgpa}</b>`;
    } else {
        document.getElementById('result').innerText = "Result পাওয়া যায়নি";
    }
}
</script>
</body>
</html>
