<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diploma Results Zone</title>
  <style>
    /* General styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Container styles */
    .container {
      width: 300px;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Heading styles */
    h1 {
      margin-bottom: 10px;
    }

    h3 {
      margin-bottom: 20px;
      font-size: 18px;
      color: #007bff; /* Blue color */
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Input styles */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    .input-group input,
    .input-group select {
      width: calc(100% - 20px);
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      margin-top: 5px;
    }

    /* Button styles */
    .btn {
      width: calc(100% - 20px);
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    /* Logo styles */
    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    .logo-container img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Facebook link styles */
    .facebook-link {
      margin-top: 20px;
      font-size: 14px;
    }

    .facebook-link a {
      color: #007bff;
      text-decoration: none;
    }

    .facebook-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<!-- Main Container -->
<div class="container">
  <!-- Logo -->
  <div class="logo-container">
    <img src="https://i.ibb.co/cDzwxrY/download-1.jpg" alt="download-1">
  </div>

  <!-- Heading -->
  <h1>Diploma Results Zone</h1>
  <h3>Diploma in Engineering</h3> <!-- Updated styling -->

  <!-- Form -->
  <form method="post" action="result.php"> <!-- Modified form -->
    <!-- Select Regulation -->
    <div class="input-group">
      <label for="regulation">Select Regulation</label>
      <select id="regulation" name="regulation" required>
        <option value="">Select</option>
        <option value="2010">2010</option>
        <option value="2016">2016</option>
        <option value="2022">2022</option>
      </select>
    </div>
    
    <!-- Enter Roll Number -->
    <div class="input-group">
      <label for="rollNumber">Enter Your Roll Number</label>
      <input type="text" id="rollNumber" name="rollNumber" placeholder="Roll Number" required>
    </div>
    
    <!-- Submit Button -->
    <button type="submit" class="btn">Check Result</button>
  </form>

  <!-- Developer's name -->
  <div class="developer-name">
    <p>Atikur Rahman Nadim</p>
  </div>

  <!-- Facebook link -->
  <div class="facebook-link">
    <a href="https://www.facebook.com/ansatikur">Developer's Facebook Profile</a>
  </div>
</div>

</body>
</html>
