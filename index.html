<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diploma Results Zone</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        min-height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 20px; 
    }
    .container { 
        width: 100%; 
        max-width: 420px; 
        background: #fff; 
        padding: 30px 25px; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        text-align: center; 
    }

    /* লোগো ঠিক করার কোড */
    .logo-container { 
        margin-bottom: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
    }
    .logo-container img { 
        width: 100px; 
        height: 100px; 
        border-radius: 50%; 
        border: 4px solid #667eea;
        object-fit: cover; /* ছবি ক্রপ হয়ে বৃত্তের মাঝে বসবে */
    }

    h1 { font-size: 24px; color: #333; margin-bottom: 5px; }
    h3 { font-size: 14px; color: #667eea; margin-bottom: 25px; font-weight: 600; letter-spacing: 1px; }

    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
    .input-group input, .input-group select { 
        width: 100%; 
        padding: 12px 15px; 
        border: 2px solid #e0e0e0; 
        border-radius: 10px; 
        font-size: 15px;
        background: #f8f9fa;
    }
    .input-group input:focus, .input-group select:focus {
        border-color: #667eea;
        outline: none;
    }

    .btn { 
        width: 100%; 
        padding: 14px; 
        border: none; 
        border-radius: 10px; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        color: #fff; 
        font-size: 16px;
        font-weight: bold;
        cursor: pointer; 
    }

    .developer-name { margin-top: 20px; color: #777; font-size: 13px; }
    .facebook-link { margin-top: 10px; }
    .facebook-link a { color: #667eea; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Bangladesh_Technical_Education_Board_logo.png" alt="BTEB Logo">
    </div>
    <h1>Diploma Results Zone</h1>
    <h3>DIPLOMA IN ENGINEERING</h3>

    <form method="post" action="result.php">
        <div class="input-group">
            <label for="regulation">Select Regulation</label>
            <select id="regulation" name="regulation" required>
                <option value="" disabled selected>Select Regulation</option>
                <option value="2010">2010</option>
                <option value="2016">2016</option>
                <option value="2022">2022</option>
            </select>
        </div>

        <div class="input-group">
            <label for="rollNumber">Enter Your Roll Number</label>
            <input type="text" id="rollNumber" name="rollNumber" placeholder="যেমন: 571779" required>
        </div>

        <button type="submit" class="btn">Check Result</button>
    </form>

    <div class="developer-name">
        <p>Developed by Atikur Rahman Nadim</p>
    </div>
    <div class="facebook-link">
        <a href="https://www.facebook.com/ansatikur">Developer's Facebook Profile</a>
    </div>
</div>
</body>
</html>
